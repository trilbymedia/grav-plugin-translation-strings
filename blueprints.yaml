name: Translation Strings
slug: translation-strings
type: plugin
version: 1.0.6
description: Manage custom translation snippets for Grav 1.7. On Grav 2.0 use the built-in Translations section in Admin 2.1 instead.
icon: language
author:
  name: Trilby Media
  email: hello@trilby.media
homepage: https://github.com/trilbymedia/grav-plugin-translation-strings
keywords: grav, plugin, translations
license: MIT

# Grav 2.0 has this built in — Admin 2.1 ships a Translations section that
# stores the same overrides as real language files under user/languages, so a
# second merge layer on 2.0 only creates a conflict this plugin would win.
# Existing 2.0 installs are unaffected until they update; the built-in editor
# offers to import from here and then disable this plugin.
compatibility:
  grav: ['1.7']

dependencies:
  - { name: grav, version: '>=1.7.0 <2.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    languages:
      type: list
      label: PLUGIN_TRANSLATION_STRINGS.LANGUAGES_LABEL
      help: PLUGIN_TRANSLATION_STRINGS.LANGUAGES_HELP
      style: vertical
      btn_label: PLUGIN_TRANSLATION_STRINGS.ADD_LANGUAGE
      collapsed: false
      fields:
        .code:
          type: select
          size: small
          style: vertical
          label: PLUGIN_TRANSLATION_STRINGS.LANGUAGE_CODE
          data-options@: '\Grav\Plugin\TranslationStringsPlugin::languageOptions'
          placeholder: en
          validate:
            required: true
        .content:
          type: editor
          label: PLUGIN_TRANSLATION_STRINGS.LANGUAGE_CONTENT
          codemirror:
            mode: yaml
            indentUnit: 2
            lineNumbers: true
            indentWithTabs: false
            styleActiveLine: true
          validate:
            type: yaml
          help: PLUGIN_TRANSLATION_STRINGS.LANGUAGE_CONTENT_HELP
